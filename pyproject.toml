[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ore-metronome"
dynamic = ["version"]
description = "PC 用メトロノーム"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "PySide6>=6.8,<7",
    "sounddevice>=0.4,<1",
    "soundfile>=0.12,<1",
    "numpy>=1.26,<3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-qt>=4.4",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pyinstaller>=6.10,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "ore_metronome.version.__version__"}

[tool.setuptools.package-data]
ore_metronome = ["assets/*", "assets/icons/*.svg"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not probe'"
markers = ["probe: 実機で音を出す確認（既定では実行しない）"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]