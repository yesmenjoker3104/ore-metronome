name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        shell: pwsh
        run: python -m pip install -e ".[dev]"

      - name: Check that the tag matches the version
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
          GITHUB_REF_TYPE: ${{ github.ref_type }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: python -m pytest -q tests/unit/test_version_consistency.py

      - name: Build the app and zip
        shell: pwsh
        run: .\scripts\build.ps1

      - name: Extract the release notes from CHANGELOG.md
        shell: pwsh
        env:
          TAG: ${{ github.ref_name }}
        run: |
          $version = $env:TAG.TrimStart('v')
          $pattern = '^## \[' + [regex]::Escape($version) + '\]'
          $inside = $false
          $notes = @()
          foreach ($line in (Get-Content -LiteralPath CHANGELOG.md -Encoding UTF8)) {
            if ($line -match '^## \[') {
              if ($inside) { break }
              $inside = $line -match $pattern
              continue
            }
            if ($inside) { $notes += $line }
          }
          if (-not $inside -and $notes.Count -eq 0) {
            throw "CHANGELOG.md has no section for $version"
          }
          Set-Content -LiteralPath "$env:RUNNER_TEMP\notes.md" -Value ($notes -join "`n") -Encoding UTF8

      - name: Create the GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: >
          gh release create $env:TAG
          dist\ore-metronome-windows-x64.zip
          dist\ore-metronome-windows-x64.zip.sha256
          --title $env:TAG
          --notes-file "$env:RUNNER_TEMP\notes.md"
          --verify-tag
